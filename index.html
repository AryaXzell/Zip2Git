<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Zip2Git — Upload ZIP & Folder directly to GitHub repositories</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0%25' y1='0%25' x2='100%25' y2='100%25'%3E%3Cstop offset='0%25' stop-color='%236366f1'/%3E%3Cstop offset='100%25' stop-color='%234f46e5'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='100' height='100' rx='28' fill='url(%23g)'/%3E%3Cpath d='M35 30 H65 C70 30 70 35 70 35 V65 C70 70 65 70 65 70 H35 C30 70 30 65 30 65 V35 C30 30 35 30 35 30 Z' fill='none' stroke='white' stroke-width='7' stroke-linejoin='round'/%3E%3Cpath d='M50 42 V58 M42 50 L50 58 L58 50' fill='none' stroke='white' stroke-width='7' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
    <script>
      // GitHub OAuth redirects to a plain path with a real query string
      // (e.g. "/auth/callback?code=...&state=..."), but this app uses
      // HashRouter ("#/..."). This tiny pre-mount script rewrites that
      // plain URL into the equivalent hash route BEFORE React mounts,
      // so react-router-dom's HashRouter can pick it up normally.
      (function () {
        var path = window.location.pathname;
        var search = window.location.search;
        if (path === '/auth/callback' && search) {
          var newUrl = window.location.origin + '/#/auth/callback' + search;
          window.location.replace(newUrl);
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
